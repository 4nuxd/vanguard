<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VT Lookup History</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { padding:18px; background:linear-gradient(180deg,#0b0d12,#050507); color:white; }
    .page-root { max-width:1100px; margin:0 auto; }
    .page-header { display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px }
    .controls { display:flex; gap:8px; align-items:center; }
    .search { padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03); color:#fff }
    .export-btn { padding:8px 10px; border-radius:8px; background:linear-gradient(90deg,#7c4dff,#4ea7ff); color:#021028; font-weight:700; border:none; cursor:pointer }
    .history-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-top:12px; }
    .history-card { padding:12px; border-radius:12px; background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.04); box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
    .vendor-list { font-size:12px; color:var(--muted); margin-top:6px }
    .controls .search { min-width:220px }
  </style>
</head>
<body>
  <div class="page-root">
    <div class="page-header">
      <div>
        <h1 style="margin:0;font-size:20px">Lookup History</h1>
        <div style="color:var(--muted);margin-top:6px">All VirusTotal lookups (local cache)</div>
      </div>
      <div class="controls">
        <input id="searchBox" class="search" placeholder="Search IOC or vendor..." />
        <button id="exportCsv" class="export-btn">Export CSV</button>
        <button id="clearAll" class="btn btn-danger">Clear All</button>
      </div>
    </div>

    <div id="historyGrid" class="history-grid"></div>
  </div>

  <script src="history.js"></script>
</body>
</html>
